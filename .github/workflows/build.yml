name: Build AURA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLATFORM: android-34
      BUILD_TOOLS: 34.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Show project files
        run: |
          find app -type f | sort
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java/com/aura/launcher

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;$PLATFORM" "build-tools;$BUILD_TOOLS"

      - name: Build APK (no Gradle)
        run: |
          set -e
          JAR="$ANDROID_HOME/platforms/$PLATFORM/android.jar"
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          O="$PWD/build"
          rm -rf "$O"; mkdir -p "$O/res" "$O/cls" "$O/dex"

          # compile-safety patch (anonymous class reads a blank final field)
          sed -i 's/final LauncherActivity a;/LauncherActivity a;/' app/src/main/java/com/aura/launcher/HomeView.java

          # 1. resources + manifest
          "$BT/aapt2" compile --dir app/src/main/res -o "$O/res"
          "$BT/aapt2" link -o "$O/base.apk" -I "$JAR" \
            --manifest app/src/main/AndroidManifest.xml \
            --min-sdk-version 19 --target-sdk-version 19 \
            --version-code 1 --version-name 1.0 \
            "$O"/res/*.flat

          # 2. Java -> classes -> dex (API 19)
          find app/src/main/java -name '*.java' > "$O/sources.txt"
          javac -encoding UTF-8 -source 8 -target 8 -Xlint:-options -nowarn -Xmaxerrs 200 \
            -bootclasspath "$JAR" -d "$O/cls" @"$O/sources.txt"
          "$BT/d8" --min-api 19 --lib "$JAR" --output "$O/dex" $(find "$O/cls" -name '*.class')

          # 3. package, align, sign
          cp "$O/base.apk" "$O/unsigned.apk"
          (cd "$O/dex" && zip -q ../unsigned.apk classes.dex)
          "$BT/zipalign" -f 4 "$O/unsigned.apk" "$O/aligned.apk"
          keytool -genkeypair -keystore "$O/debug.keystore" -storepass android -keypass android \
            -alias aura -dname "CN=AURA" -keyalg RSA -keysize 2048 -validity 10000
          "$BT/apksigner" sign --ks "$O/debug.keystore" --ks-pass pass:android --key-pass pass:android \
            --out "$O/AURA-debug.apk" "$O/aligned.apk"
          "$BT/apksigner" verify --verbose "$O/AURA-debug.apk"
          "$BT/aapt2" dump badging "$O/AURA-debug.apk" | head -12

      - uses: actions/upload-artifact@v4
        with:
          name: AURA-debug-apk
          path: build/AURA-debug.apk
