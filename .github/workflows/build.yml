name: Build AURA APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Locate project folder
        run: |
          D=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -1)")
          echo "Project dir: $D"
          echo "PROJ=$D" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-33" "build-tools;30.0.3"

      - name: Install Gradle 7.5.1 (with retries and a backup source)
        run: |
          for u in \
            https://services.gradle.org/distributions/gradle-7.5.1-bin.zip \
            https://github.com/gradle/gradle-distributions/releases/download/v7.5.1/gradle-7.5.1-bin.zip
          do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/gradle.zip "$u" && break
          done
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-7.5.1/bin" >> "$GITHUB_PATH"

      - name: Safety patch for HomeView
        run: sed -i 's/final LauncherActivity a;/LauncherActivity a;/' "$(find . -name HomeView.java | head -1)"

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
